<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lembrando formulários</title>
    <style>
        body{
            background-color: gray;
            font-family: Arial, Helvetica, sans-serif;
        }
        main{
            margin: 0 auto;
            padding: 10px;
            border-radius: 10px;
            
            width: 300px;
            background-color: lightgreen;
        }
        h1{
            text-align: center;
        }
        form label {
            color: #37474f; /* Cinza Escuro */
            display: block;
            margin-bottom: 10px;
            font-weight: bold;
        }
        form input[type="text"], 
        form input[type="password"], 
        form input[type="email"], 
        form input[type="number"] {
            background-color: #ffffff; /* Branco */
            border: 1px solid #b0bec5; /* Cinza Claro */
            padding: 10px;
            border-radius: 5px;
            width: 100%;
            margin-bottom: 15px;
            box-sizing: border-box;
        }
        button {
            background-color: #00796b; /* Azul Escuro */
            color: #ffffff; /* Branco */
            border: none;
            margin: 5px;
            padding: 10px 15px;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
        }
    </style>
</head>
<body>
    <main>
        <h1>formulário de teste</h1>
        <form action="cadastro.php" method="get">
            <div>
                <label for="inome">Nome:</label>
                <input type="text" name="nome" id="inome">
            </div>
            <div>
                <label for="isobrenome">sobrenome:</label>
                <input type="text" name="sobrenome" id="isobrenome">
            </div>
            <div>
                <button type="submit">enviar</button>
                <button type="reset">limpar</button>
            </div>
        </form>
    </main>
</body>
</html>
